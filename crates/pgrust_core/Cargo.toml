[package]
name = "pgrust_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.10"
serde_json = "1"
time = { version = "0.3.44", features = ["local-offset","macros","formatting"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3.31"
tar = "0.4.44"
flate2 = "1.1.5"